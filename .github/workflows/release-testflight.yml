name: Release to TestFlight
run-name: Release Pigeon to TestFlight [${{ inputs.request_id || github.run_id }}]

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Optional identifier used to match this workflow run
        required: false
        default: ""
        type: string
      marketing_version:
        description: Optional marketing version override, such as 1.0.1
        required: false
        default: ""
        type: string
      internal_only:
        description: Restrict this build to internal TestFlight testing only
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: pigeon-testflight-release
  cancel-in-progress: false

jobs:
  upload:
    name: Build and upload
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - pigeon-ci
    timeout-minutes: 90
    environment: testflight
    outputs:
      marketing_version: ${{ steps.release_metadata.outputs.marketing_version }}
      build_number: ${{ steps.release_metadata.outputs.build_number }}
    env:
      APP_DIRECTORY: ios/PigeonReader
      BUNDLE_ID: com.hans.pigeon.reader
      WIDGETS_BUNDLE_ID: com.hans.pigeon.reader.widgets
      SHARE_BUNDLE_ID: com.hans.pigeon.reader.share
      APP_GROUP: group.com.hans.pigeon.reader
      PROJECT: ios/PigeonReader/PigeonReader.xcodeproj
      SCHEME: PigeonReader
      RELEASE_ROOT: ${{ github.workspace }}/.release/pigeon-testflight-${{ github.run_id }}-${{ github.run_attempt }}
      DERIVED_DATA_PATH: ${{ github.workspace }}/.release/pigeon-testflight-${{ github.run_id }}-${{ github.run_attempt }}/DerivedData
      ARCHIVE_PATH: ${{ github.workspace }}/.release/pigeon-testflight-${{ github.run_id }}-${{ github.run_attempt }}/PigeonReader.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/.release/pigeon-testflight-${{ github.run_id }}-${{ github.run_attempt }}/export
      EXPORT_OPTIONS_PLIST: ${{ github.workspace }}/.release/pigeon-testflight-${{ github.run_id }}-${{ github.run_attempt }}/ExportOptions.plist
      KEYCHAIN_PATH: ${{ github.workspace }}/.release/pigeon-testflight-${{ github.run_id }}-${{ github.run_attempt }}/pigeon-signing.keychain-db
      KEYCHAIN_SEARCH_LIST_PATH: ${{ github.workspace }}/.release/pigeon-testflight-${{ github.run_id }}-${{ github.run_attempt }}/original-keychain-search-list.txt
      CERTIFICATE_PATH: ${{ github.workspace }}/.release/pigeon-testflight-${{ github.run_id }}-${{ github.run_attempt }}/distribution-certificate.p12
      PROFILE_SOURCE_PATH: ${{ github.workspace }}/.release/pigeon-testflight-${{ github.run_id }}-${{ github.run_attempt }}/PigeonReader.mobileprovision
      WIDGETS_PROFILE_SOURCE_PATH: ${{ github.workspace }}/.release/pigeon-testflight-${{ github.run_id }}-${{ github.run_attempt }}/PigeonWidgets.mobileprovision
      SHARE_PROFILE_SOURCE_PATH: ${{ github.workspace }}/.release/pigeon-testflight-${{ github.run_id }}-${{ github.run_attempt }}/PigeonShareExtension.mobileprovision
      PROFILE_MANIFEST_PATH: ${{ github.workspace }}/.release/pigeon-testflight-${{ github.run_id }}-${{ github.run_attempt }}/installed-profile.tsv
      AUTH_KEY_PATH: ${{ github.workspace }}/.release/pigeon-testflight-${{ github.run_id }}-${{ github.run_attempt }}/AuthKey.p8

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Require the dispatched main commit
        shell: bash
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "$checked_out_sha" != "$GITHUB_SHA" ]]; then
            echo "main advanced between dispatch and checkout; refusing to release a different commit." >&2
            exit 1
          fi

      - name: Require a main-branch dispatch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Trigger this workflow from the main branch." >&2
            exit 1
          fi

      - name: Verify runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          command -v node
          command -v npm
          command -v xcodegen
          command -v xcodebuild
          command -v xcrun
          test -x /usr/bin/python3
          xcodebuild -version
          swift --version

      - name: Install Worker dependencies
        run: npm ci

      - name: Run Worker tests and type checking
        run: |
          set -euo pipefail
          npm test
          npm run test:testflight
          npx tsc --noEmit

      - name: Generate Xcode project
        working-directory: ${{ env.APP_DIRECTORY }}
        run: xcodegen generate

      - name: Select an available iPhone simulator
        id: simulator
        run: .github/scripts/select-ios-simulator.sh

      - name: Run Pigeon tests
        run: |
          set -o pipefail
          xcodebuild test \
            -jobs 2 \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO

      - name: Compute build number
        id: build_number
        shell: bash
        run: echo "value=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))" >> "$GITHUB_OUTPUT"

      - name: Install and validate signing assets
        id: signing_assets
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APP_PROVISION_PROFILE_BASE64: ${{ secrets.APP_PROVISION_PROFILE_BASE64 }}
          APP_PROVISION_PROFILE_WIDGETS_BASE64: ${{ secrets.APP_PROVISION_PROFILE_WIDGETS_BASE64 }}
          APP_PROVISION_PROFILE_SHARE_BASE64: ${{ secrets.APP_PROVISION_PROFILE_SHARE_BASE64 }}
        run: |
          set -euo pipefail

          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID secret}"
          : "${APP_STORE_CONNECT_PRIVATE_KEY:?Missing APP_STORE_CONNECT_PRIVATE_KEY secret}"
          : "${BUILD_CERTIFICATE_BASE64:?Missing BUILD_CERTIFICATE_BASE64 secret}"
          : "${P12_PASSWORD:?Missing P12_PASSWORD secret}"
          : "${APP_PROVISION_PROFILE_BASE64:?Missing APP_PROVISION_PROFILE_BASE64 secret}"
          : "${APP_PROVISION_PROFILE_WIDGETS_BASE64:?Missing APP_PROVISION_PROFILE_WIDGETS_BASE64 secret}"
          : "${APP_PROVISION_PROFILE_SHARE_BASE64:?Missing APP_PROVISION_PROFILE_SHARE_BASE64 secret}"

          mkdir -p "$RELEASE_ROOT"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$AUTH_KEY_PATH"
          chmod 600 "$AUTH_KEY_PATH"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$APP_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_SOURCE_PATH"
          printf '%s' "$APP_PROVISION_PROFILE_WIDGETS_BASE64" | base64 --decode > "$WIDGETS_PROFILE_SOURCE_PATH"
          printf '%s' "$APP_PROVISION_PROFILE_SHARE_BASE64" | base64 --decode > "$SHARE_PROFILE_SOURCE_PATH"

          security list-keychains -d user \
            | sed -e 's/^[[:space:]]*//' -e 's/^"//' -e 's/"$//' \
            > "$KEYCHAIN_SEARCH_LIST_PATH"

          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$KEYCHAIN_PATH" >/dev/null

          keychain_search_list=("$KEYCHAIN_PATH")
          while IFS= read -r keychain; do
            [[ -n "$keychain" ]] && keychain_search_list+=("$keychain")
          done < "$KEYCHAIN_SEARCH_LIST_PATH"
          security list-keychains -d user -s "${keychain_search_list[@]}"

          signing_identity="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | awk '/Apple Distribution/ { print $2; exit }'
          )"
          if [[ -z "$signing_identity" ]]; then
            echo "BUILD_CERTIFICATE_BASE64 does not contain an Apple Distribution identity." >&2
            exit 1
          fi

          signing_test_path="$RELEASE_ROOT/codesign-test"
          cp /usr/bin/true "$signing_test_path"
          codesign --force --sign "$signing_identity" --keychain "$KEYCHAIN_PATH" "$signing_test_path"
          codesign --verify --strict "$signing_test_path"
          rm -f "$signing_test_path"

          install_and_validate_profile() {
            local profile_source_path="$1"
            local profile_plist="$2"
            local expected_bundle_id="$3"
            local profile_label="$4"

            security cms -D -i "$profile_source_path" > "$profile_plist"
            local profile_name
            local profile_uuid
            local application_identifier
            local get_task_allow
            if ! profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"; then
              echo "Unable to read the $profile_label provisioning profile name." >&2
              return 1
            fi
            if ! profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"; then
              echo "Unable to read the $profile_label provisioning profile UUID." >&2
              return 1
            fi
            if ! application_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"; then
              echo "Unable to read the $profile_label application identifier." >&2
              return 1
            fi
            get_task_allow="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$profile_plist" 2>/dev/null || echo false)"

            if [[ "$application_identifier" != "$APPLE_TEAM_ID.$expected_bundle_id" ]]; then
              echo "The $profile_label provisioning profile does not match $expected_bundle_id and team $APPLE_TEAM_ID." >&2
              return 1
            fi
            if [[ "$get_task_allow" == "true" ]]; then
              echo "The $profile_label provisioning profile is a development profile; TestFlight requires an App Store profile." >&2
              return 1
            fi
            if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$profile_plist" >/dev/null 2>&1; then
              echo "The $profile_label provisioning profile contains device registrations; TestFlight requires an App Store profile." >&2
              return 1
            fi
            if [[ "$(/usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "$profile_plist" 2>/dev/null || echo false)" == "true" ]]; then
              echo "The $profile_label provisioning profile is an enterprise profile; TestFlight requires an App Store profile." >&2
              return 1
            fi
            if ! /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$profile_plist" 2>/dev/null | grep -Fq "$APP_GROUP"; then
              echo "The $profile_label provisioning profile does not include App Group $APP_GROUP." >&2
              return 1
            fi

            local profile_install_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
            local installed_profile_path="$profile_install_dir/$profile_uuid.mobileprovision"
            local profile_backup_path=""
            mkdir -p "$profile_install_dir"
            if [[ -f "$installed_profile_path" ]]; then
              profile_backup_path="$RELEASE_ROOT/$profile_label-$profile_uuid.backup.mobileprovision"
              cp "$installed_profile_path" "$profile_backup_path"
            fi
            printf '%s\t%s\n' "$installed_profile_path" "$profile_backup_path" >> "$PROFILE_MANIFEST_PATH"
            cp "$profile_source_path" "$installed_profile_path"

            printf '%s' "$profile_name"
          }

          : > "$PROFILE_MANIFEST_PATH"
          profile_name="$(install_and_validate_profile \
            "$PROFILE_SOURCE_PATH" \
            "$RELEASE_ROOT/PigeonReader-profile.plist" \
            "$BUNDLE_ID" \
            "PigeonReader")"
          widgets_profile_name="$(install_and_validate_profile \
            "$WIDGETS_PROFILE_SOURCE_PATH" \
            "$RELEASE_ROOT/PigeonWidgets-profile.plist" \
            "$WIDGETS_BUNDLE_ID" \
            "PigeonWidgets")"
          share_profile_name="$(install_and_validate_profile \
            "$SHARE_PROFILE_SOURCE_PATH" \
            "$RELEASE_ROOT/PigeonShareExtension-profile.plist" \
            "$SHARE_BUNDLE_ID" \
            "PigeonShareExtension")"

          {
            echo "profile_name=$profile_name"
            echo "widgets_profile_name=$widgets_profile_name"
            echo "share_profile_name=$share_profile_name"
          } >> "$GITHUB_OUTPUT"

      - name: Create export options
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ steps.signing_assets.outputs.profile_name }}
          WIDGETS_PROFILE_NAME: ${{ steps.signing_assets.outputs.widgets_profile_name }}
          SHARE_PROFILE_NAME: ${{ steps.signing_assets.outputs.share_profile_name }}
          INTERNAL_ONLY: ${{ inputs.internal_only }}
        run: |
          set -euo pipefail

          internal_only_tag='<false/>'
          if [[ "$INTERNAL_ONLY" == "true" ]]; then
            internal_only_tag='<true/>'
          fi

          cat > "$EXPORT_OPTIONS_PLIST" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>upload</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>method</key>
            <string>app-store-connect</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
              <key>${WIDGETS_BUNDLE_ID}</key>
              <string>${WIDGETS_PROFILE_NAME}</string>
              <key>${SHARE_BUNDLE_ID}</key>
              <string>${SHARE_PROFILE_NAME}</string>
            </dict>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>testFlightInternalTestingOnly</key>
            ${internal_only_tag}
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          plutil -lint "$EXPORT_OPTIONS_PLIST"

      - name: Archive release build
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ steps.signing_assets.outputs.profile_name }}
          WIDGETS_PROFILE_NAME: ${{ steps.signing_assets.outputs.widgets_profile_name }}
          SHARE_PROFILE_NAME: ${{ steps.signing_assets.outputs.share_profile_name }}
          MARKETING_VERSION_OVERRIDE: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail

          archive_arguments=(
            archive
            -jobs 2
            -project "$PROJECT"
            -scheme "$SCHEME"
            -configuration Release
            -destination 'generic/platform=iOS'
            -archivePath "$ARCHIVE_PATH"
            -derivedDataPath "$DERIVED_DATA_PATH"
          )
          if [[ -n "$MARKETING_VERSION_OVERRIDE" ]]; then
            if [[ ! "$MARKETING_VERSION_OVERRIDE" =~ ^[0-9]+([.][0-9]+){0,2}$ ]]; then
              echo "marketing_version must contain one to three numeric components." >&2
              exit 1
            fi
            archive_arguments+=("MARKETING_VERSION=$MARKETING_VERSION_OVERRIDE")
          fi

          archive_arguments+=(
            CURRENT_PROJECT_VERSION="${{ steps.build_number.outputs.value }}"
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
            CODE_SIGN_STYLE=Manual
            CODE_SIGN_IDENTITY='Apple Distribution'
            PIGEON_READER_PROFILE_NAME="$PROFILE_NAME"
            PIGEON_WIDGETS_PROFILE_NAME="$WIDGETS_PROFILE_NAME"
            PIGEON_SHARE_PROFILE_NAME="$SHARE_PROFILE_NAME"
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"
          )
          xcodebuild "${archive_arguments[@]}"

      - name: Upload archive to TestFlight
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail

          : "${APP_STORE_CONNECT_KEY_ID:?Missing APP_STORE_CONNECT_KEY_ID secret}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?Missing APP_STORE_CONNECT_ISSUER_ID secret}"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PLIST" \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Record uploaded build metadata
        id: release_metadata
        shell: bash
        run: |
          set -euo pipefail
          archive_info="$ARCHIVE_PATH/Info.plist"
          version="$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' "$archive_info")"
          build="$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleVersion' "$archive_info")"
          expected_build="${{ steps.build_number.outputs.value }}"
          if [[ "$build" != "$expected_build" ]]; then
            echo "The archived build number $build does not match the workflow-derived build number $expected_build." >&2
            exit 1
          fi
          {
            echo "marketing_version=$version"
            echo "build_number=$build"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Pigeon TestFlight upload"
            echo "- Version: $version ($build)"
            echo "- Bundle ID: $BUNDLE_ID"
            echo "- Commit: $GITHUB_SHA"
            echo "- Upload: accepted by xcodebuild export; downstream App Store Connect API verification is required."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up release assets
        if: always()
        shell: bash
        run: |
          set +e

          if [[ -f "$PROFILE_MANIFEST_PATH" ]]; then
            while IFS=$'\t' read -r installed_path backup_path; do
              if [[ -n "$backup_path" && -f "$backup_path" ]]; then
                cp "$backup_path" "$installed_path"
              else
                rm -f "$installed_path"
              fi
            done < "$PROFILE_MANIFEST_PATH"
          fi

          if [[ -s "$KEYCHAIN_SEARCH_LIST_PATH" ]]; then
            original_keychain_search_list=()
            while IFS= read -r keychain; do
              [[ -n "$keychain" ]] && original_keychain_search_list+=("$keychain")
            done < "$KEYCHAIN_SEARCH_LIST_PATH"
            if (( ${#original_keychain_search_list[@]} > 0 )); then
              security list-keychains -d user -s "${original_keychain_search_list[@]}"
            fi
          fi

          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null
          rm -rf "$RELEASE_ROOT"

  verify:
    name: Verify App Store Connect build
    needs: upload
    if: ${{ needs.upload.result == 'success' }}
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - pigeon-ci
    timeout-minutes: 30
    environment: testflight
    env:
      BUNDLE_ID: com.hans.pigeon.reader
      MARKETING_VERSION: ${{ needs.upload.outputs.marketing_version }}
      BUILD_NUMBER: ${{ needs.upload.outputs.build_number }}
      BETA_GROUP_NAME: Pigeon Internal
      ASC_TIMEOUT_SECONDS: "900"
      ASC_POLL_INTERVAL_SECONDS: "15"

    steps:
      - name: Check out the uploaded commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact build and TestFlight group availability
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${APP_STORE_CONNECT_KEY_ID:?Missing APP_STORE_CONNECT_KEY_ID secret}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?Missing APP_STORE_CONNECT_ISSUER_ID secret}"
          : "${APP_STORE_CONNECT_PRIVATE_KEY:?Missing APP_STORE_CONNECT_PRIVATE_KEY secret}"

          if ! verification_summary="$(node scripts/app-store-connect-verify.mjs 2>&1)"; then
            {
              echo "### Pigeon App Store Connect verification"
              echo "- Status: failed"
              printf '%s\n' "$verification_summary"
            } >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' "$verification_summary" >&2
            exit 1
          fi
          printf '%s\n' "$verification_summary" | tee -a "$GITHUB_STEP_SUMMARY"
