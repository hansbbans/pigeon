name: CI

# Pull requests and pushes to main run all iOS unit tests plus the smoke UI
# tests in .github/ios-smoke-ui-tests.txt. The nightly schedule and full-suite
# dispatches run every UI test; TestFlight releases reuse only such a full run.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly full suite on main; skipped when main's HEAD already passed it.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      ui_suite:
        description: UI tests to run (full runs every UI test and counts as TestFlight release evidence on main)
        required: true
        default: full
        type: choice
        options:
          - full
          - smoke

permissions:
  contents: read

concurrency:
  group: pigeon-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Classify validation scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      # A nightly run whose commit already passed the full suite skips both suites.
      native: ${{ steps.nightly.outputs.full_suite_exists == 'true' && 'false' || steps.scope.outputs.native }}
      worker: ${{ steps.nightly.outputs.full_suite_exists == 'true' && 'false' || steps.scope.outputs.worker }}
      ui_suite: ${{ steps.scope.outputs.ui_suite }}
      safari: ${{ steps.nightly.outputs.full_suite_exists == 'true' && 'false' || steps.scope.outputs.safari }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Classify complete change range
        id: scope
        run: python3 .github/scripts/ci_scope.py scope --repo pigeon
      - uses: actions/setup-node@v5
        if: github.event_name == 'schedule'
        with:
          node-version: 22
      # Only run the nightly full suite when main changed since the last full run.
      # Unreadable evidence answers false, so the nightly runs.
      - name: Check for an earlier full-suite run of this commit
        id: nightly
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/testflight-ci-gate.mjs --full-suite-exists

  tooling:
    name: CI and release tooling fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Test scope and required gate
        run: python3 .github/scripts/test_ci_scope.py
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify TestFlight release tooling
        run: npm run test:testflight
      - name: Verify simulator ownership guards
        run: python3 .github/scripts/test_ios_simulator_session.py
      - name: Verify iOS smoke UI test list
        run: |
          python3 .github/scripts/test_ios_smoke_tests.py
          python3 .github/scripts/ios_smoke_tests.py check
      - name: Verify shared runner helpers
        run: |
          bash .github/scripts/test-ios-runner-lock.sh
          bash .github/scripts/test-kill-orphaned-xcodebuild.sh

  worker:
    needs: scope
    if: needs.scope.outputs.worker == 'true'
    name: Worker tests, types, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json
      - run: npm ci
      # The step name "Run npm run check" is release evidence (scripts/testflight-ci-gate.mjs).
      - run: npm run check
      # The browser extension is its own npm package and Node-only, so it rides the Worker job.
      - name: Install browser extension dependencies
        working-directory: extension
        run: npm ci
      - name: Test, typecheck, build, and audit the browser extension
        working-directory: extension
        run: npm run check

  # The Safari container app (extension/safari/) is a small macOS app, not
  # part of the iOS app. It builds on a GitHub-hosted Mac (free: the repo is
  # public), so it never waits for or loads the shared self-hosted Mac and its
  # iOS runner lock. ci_scope.py runs it only when extension/safari/,
  # extension/scripts/build-safari.sh or CI itself changes, and on full runs.
  safari:
    needs: scope
    if: needs.scope.outputs.safari == 'true'
    name: Safari container app build
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install xcodegen
        run: command -v xcodegen || brew install xcodegen
      - name: Install browser extension dependencies
        working-directory: extension
        run: npm ci
      - name: Build the web extension and the ad-hoc signed container app
        working-directory: extension
        run: |
          xcodebuild -version
          npm run build:safari
      - name: Upload the xcodebuild log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: safari-xcodebuild-log
          path: extension/safari/build/xcodebuild.log
          if-no-files-found: ignore

  native:
    needs: scope
    if: needs.scope.outputs.native == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: iOS tests and clean Release build
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - pigeon-ci
    # Up to 60 minutes may be spent waiting for the shared iOS runner lock,
    # then the build and the always() cleanup need their own budget.
    timeout-minutes: 160
    env:
      APP_DIRECTORY: ios/PigeonReader
      PROJECT: ios/PigeonReader/PigeonReader.xcodeproj
      SCHEME: PigeonReader
    steps:
      - uses: actions/checkout@v5
      - name: Verify native build tools
        run: |
          set -euo pipefail
          command -v xcodegen
          command -v xcodebuild
          xcodebuild -version
          swift --version
      - name: Verify simulator ownership guards
        run: python3 .github/scripts/test_ios_simulator_session.py
      - name: Generate Xcode project
        working-directory: ${{ env.APP_DIRECTORY }}
        run: xcodegen generate
      - name: Verify product display names
        run: bash .github/scripts/verify-product-display-names.sh
      - name: Verify signing profile mapping
        run: bash .github/scripts/verify-provisioning-profile-mapping.sh
      - name: Kill xcodebuild orphans from earlier runs
        run: bash .github/scripts/kill-orphaned-xcodebuild.sh
      - name: Acquire the shared iOS runner lock
        timeout-minutes: 65
        run: bash .github/scripts/ios-runner-lock.sh acquire
      - name: Select simulator
        id: simulator
        run: .github/scripts/select-ios-simulator.sh
      # Exactly one of the next two steps runs. The step names are release
      # evidence: scripts/testflight-ci-gate.mjs reuses a CI run for TestFlight
      # only when "Run unit and full UI tests" succeeded. Do not rename them
      # without updating the gate and its tests.
      - name: Run unit and smoke UI tests
        if: needs.scope.outputs.ui_suite == 'smoke'
        timeout-minutes: 60
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
          DERIVED_DATA_PATH: ${{ runner.temp }}/pigeon-ci-${{ github.run_id }}-${{ github.run_attempt }}
          TEST_RESULT_BUNDLE: ${{ runner.temp }}/PigeonReaderTests-${{ github.run_id }}-${{ github.run_attempt }}.xcresult
        shell: bash
        run: .github/scripts/run-ios-tests.sh smoke
      - name: Run unit and full UI tests
        if: needs.scope.outputs.ui_suite != 'smoke'
        timeout-minutes: 60
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
          DERIVED_DATA_PATH: ${{ runner.temp }}/pigeon-ci-${{ github.run_id }}-${{ github.run_attempt }}
          TEST_RESULT_BUNDLE: ${{ runner.temp }}/PigeonReaderTests-${{ github.run_id }}-${{ github.run_attempt }}.xcresult
        shell: bash
        run: .github/scripts/run-ios-tests.sh full
      - name: Upload native test result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PigeonReaderTests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/PigeonReaderTests-${{ github.run_id }}-${{ github.run_attempt }}.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Clean Release build
        # Pull requests stop at the tests; main, nightly and dispatched runs keep
        # this build, and only those count as release evidence. See docs/ci-validation.md.
        if: github.event_name != 'pull_request'
        timeout-minutes: 20
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/pigeon-ci-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -o pipefail
          build_log="$RUNNER_TEMP/pigeon-xcode-release.log"
          xcodebuild clean build \
            -jobs 2 \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO 2>&1 | tee "$build_log"
          .github/scripts/fail-on-first-party-warnings.sh "$build_log"

      - name: Kill build processes this job left behind
        if: always()
        shell: bash
        env:
          ORPHAN_INCLUDE_CURRENT_RUN: "1"
        run: bash .github/scripts/kill-orphaned-xcodebuild.sh

      - name: Shut down this job's simulator
        if: always()
        shell: bash
        run: python3 .github/scripts/ios-simulator-session.py finish "${{ steps.simulator.outputs.ownership_file }}"

      - name: Release the shared iOS runner lock
        if: always()
        shell: bash
        run: bash .github/scripts/ios-runner-lock.sh release

  required:
    name: CI required validation
    if: always()
    needs: [scope, tooling, native, worker, safari]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Require successful selected validation
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_scope.py gate --repo pigeon
