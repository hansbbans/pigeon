name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pigeon-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Classify validation scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.scope.outputs.native }}
      worker: ${{ steps.scope.outputs.worker }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Classify complete change range
        id: scope
        run: python3 .github/scripts/ci_scope.py scope --repo pigeon

  tooling:
    name: CI and release tooling fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Test scope and required gate
        run: python3 .github/scripts/test_ci_scope.py
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify TestFlight release tooling
        run: node --test test/app-store-connect-verify.test.mjs test/testflight-ci-gate.test.mjs test/testflight-release-monitor.test.mjs
      - name: Verify simulator ownership guards
        run: python3 .github/scripts/test_ios_simulator_session.py

  worker:
    needs: scope
    if: needs.scope.outputs.worker == 'true'
    name: Worker tests, types, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  native:
    needs: scope
    if: needs.scope.outputs.native == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    name: iOS tests and clean Release build
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - pigeon-ci
    timeout-minutes: 45
    env:
      APP_DIRECTORY: ios/PigeonReader
      PROJECT: ios/PigeonReader/PigeonReader.xcodeproj
      SCHEME: PigeonReader
    steps:
      - uses: actions/checkout@v5
      - name: Verify native build tools
        run: |
          set -euo pipefail
          command -v xcodegen
          command -v xcodebuild
          xcodebuild -version
          swift --version
      - name: Verify simulator ownership guards
        run: python3 .github/scripts/test_ios_simulator_session.py
      - name: Generate Xcode project
        working-directory: ${{ env.APP_DIRECTORY }}
        run: xcodegen generate
      - name: Verify product display names
        run: bash .github/scripts/verify-product-display-names.sh
      - name: Verify signing profile mapping
        run: bash .github/scripts/verify-provisioning-profile-mapping.sh
      - name: Select simulator
        id: simulator
        run: .github/scripts/select-ios-simulator.sh
      - name: Run unit and UI tests
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/pigeon-ci-${{ github.run_id }}-${{ github.run_attempt }}
          TEST_RESULT_BUNDLE: ${{ runner.temp }}/PigeonReaderTests-${{ github.run_id }}-${{ github.run_attempt }}.xcresult
        shell: bash
        run: |
          set -o pipefail
          test_log="$RUNNER_TEMP/pigeon-xcode-test.log"
          xcodebuild test \
            -jobs 2 \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -parallel-testing-enabled NO \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -resultBundlePath "$TEST_RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO 2>&1 | tee "$test_log"
          .github/scripts/fail-on-first-party-warnings.sh "$test_log"
      - name: Upload native test result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PigeonReaderTests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/PigeonReaderTests-${{ github.run_id }}-${{ github.run_attempt }}.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Clean Release build
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/pigeon-ci-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -o pipefail
          build_log="$RUNNER_TEMP/pigeon-xcode-release.log"
          xcodebuild clean build \
            -jobs 2 \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO 2>&1 | tee "$build_log"
          .github/scripts/fail-on-first-party-warnings.sh "$build_log"

      - name: Shut down this job's simulator
        if: always()
        shell: bash
        run: python3 .github/scripts/ios-simulator-session.py finish "${{ steps.simulator.outputs.ownership_file }}"

  required:
    name: CI required validation
    if: always()
    needs: [scope, tooling, native, worker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Require successful selected validation
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_scope.py gate --repo pigeon
