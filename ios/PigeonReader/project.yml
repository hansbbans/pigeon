name: PigeonReader
options:
  bundleIdPrefix: com.hans.pigeon
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  PigeonReader:
    type: application
    platform: iOS
    sources:
      - path: PigeonReader
    info:
      path: PigeonReader/Resources/Info.plist
      properties:
        CFBundleDisplayName: Pigeon Reader
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.news
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        UIAppFonts:
          - Bookerly-Regular.ttf
          - Bookerly-Bold.ttf
          - Bookerly-Italic.ttf
          - Bookerly-BoldItalic.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hans.pigeon.reader
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - PigeonReaderTests
  PigeonReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PigeonReaderTests
    dependencies:
      - target: PigeonReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hans.pigeon.reader.tests
        GENERATE_INFOPLIST_FILE: YES
