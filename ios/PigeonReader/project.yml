name: PigeonReader
options:
  bundleIdPrefix: com.hans.pigeon
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  PigeonReader:
    type: application
    platform: iOS
    sources:
      - path: PigeonReader
    resources:
      - path: PigeonReader/Resources/Readability.js
    dependencies:
      - sdk: libsqlite3.tbd
      - target: PigeonWidgets
        embed: true
      - target: PigeonShareExtension
        embed: true
    info:
      path: PigeonReader/Resources/Info.plist
      properties:
        CFBundleDisplayName: Pigeon Reader
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.news
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.hans.pigeon.reader.refresh
        CFBundleURLTypes:
          - CFBundleURLName: com.hans.pigeon.reader
            CFBundleURLSchemes:
              - pigeon
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        UIAppFonts:
          - Bookerly-Regular.ttf
          - Bookerly-Bold.ttf
          - Bookerly-Italic.ttf
          - Bookerly-BoldItalic.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hans.pigeon.reader
        PROVISIONING_PROFILE_SPECIFIER: "$(PIGEON_READER_PROFILE_NAME)"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: PigeonReader/Resources/PigeonReader.entitlements
    scheme:
      testTargets:
        - PigeonReaderTests
        - PigeonReaderUITests
  PigeonWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PigeonWidgets
      - path: PigeonReader/Shared/PigeonSharedData.swift
    info:
      path: PigeonWidgets/Info.plist
      properties:
        CFBundleDisplayName: Pigeon Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hans.pigeon.reader.widgets
        PROVISIONING_PROFILE_SPECIFIER: "$(PIGEON_WIDGETS_PROFILE_NAME)"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: PigeonWidgets/PigeonWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  PigeonShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: PigeonShareExtension
      - path: PigeonReader/Shared/PigeonSharedData.swift
    info:
      path: PigeonShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Add to Pigeon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hans.pigeon.reader.share
        PROVISIONING_PROFILE_SPECIFIER: "$(PIGEON_SHARE_PROFILE_NAME)"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: PigeonShareExtension/PigeonShareExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  PigeonReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PigeonReaderTests
    dependencies:
      - target: PigeonReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hans.pigeon.reader.tests
        GENERATE_INFOPLIST_FILE: YES
  PigeonReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PigeonReaderUITests
    dependencies:
      - target: PigeonReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hans.pigeon.reader.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
