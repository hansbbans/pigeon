name = "pigeon"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true

[[routes]]
pattern = "pigeon.hanscho.com"
custom_domain = true

# --- D1 Database ---
# After creating the database with `wrangler d1 create pigeon-db`,
# paste the database_id below.
[[d1_databases]]
binding = "DB"
database_name = "pigeon-db"
database_id = "65ec27b1-54fa-4c5f-ba3c-577ea5e334ad"

# Keep the CPU-heavy recommendation implementation out of the public
# Worker's 10 ms Free-plan HTTP budget. The helper Worker owns the SQLite
# Durable Object class; this binding intentionally targets that Worker.
[[durable_objects.bindings]]
name = "RECOMMENDATIONS"
class_name = "RecommendationEngine"
script_name = "pigeon-recommendations"

# --- Environment Variables ---
[vars]
BASE_URL = "https://pigeon.hanscho.com"
ITEMS_PER_FEED = "50"
TRUSTED_FORWARDER = "hans.cho@gmail.com"
# API_PASSWORD set via `wrangler secret put API_PASSWORD`

# --- Cron Triggers ---
# RSS feed refresh. Each run refreshes at most five due feeds (the Free plan's per-invocation
# D1 query allowance), so this cadence sets the ceiling: 60 feed polls an hour. A run with
# nothing due costs a handful of reads and no writes. Raising the cadence raises D1 rows written
# (about ten per poll) against the Free plan's daily cap, so size it to the feed count.
[triggers]
crons = ["*/5 * * * *"]
